<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Green Floating Stick</title>
    <style>
      #stick {
        border-radius: 10%;
        height: 120px;
        width: 10px;
        position: absolute;
        background: green;
        box-shadow: 12px 10px black;
      }
    </style>
  </head>

  <body>
    <div id="stick">
    </div>
    <script>
      let nameObj = "Stick" ///string global variable
      let speed = 1; //number global variable
      let moving = true; //boolean global variable

      let x = 100;
      let y = 100;
      let dx = speed;
      let dy = speed;

      function moveStick () {
        if (moving) {
          x += dx;
          y += dy;
          if (x > window.innerWidth - 50 || x < 0) {
            dx = -dx;
          }
          if (y > window.innerHeight - 50 || y < 0) {
            dy = -dy;
          }

          stick.style.left = x + "px";
          stick.style.top = y + "px";
        }

      }

      function showInfo () {
        console.log(nameObj, speed, moving);
      }
      showInfo();
      setInterval(moveStick, 20);
    </script>
  </body>
</html>
